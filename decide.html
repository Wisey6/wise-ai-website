<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Wise AI: Lead review</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<!--
  The lead scout's emailed Approve / Skip links land here (decide.html#<token>). The token stays in the
  URL fragment, so it is never sent to this site's server or written to its logs. Opening the page only
  shows what the link would do (a read). Nothing changes until the button is pressed, so mail scanners
  that open links cannot approve anything. The button calls the agent function once; links work once
  and expire after 7 days. No build step, no secrets: the key below is the project's public
  (publishable) key, the same one the hub uses.
-->
<style>
  :root { --ink:#0A0E11; --body:#3A3F44; --muted:#5B6168; --line:#E3E6E9; --paper:#FFFFFF; --mist:#F6F7F8; --blue:#2563EB; --up:#16A34A; --rose:#E11D48; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--mist); color: var(--body); font: 400 16px/1.5 Inter, -apple-system, "Segoe UI", Arial, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
  header img { height: 28px; }
  h1 { font: 700 22px/1.25 Archivo, Inter, sans-serif; color: var(--ink); margin: 0 0 6px; }
  .card { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 20px; }
  .lead { margin: 0 0 16px; color: var(--muted); font-size: 14px; }
  ul { list-style: none; margin: 0 0 16px; padding: 0; }
  li { padding: 12px 0; border-top: 1px solid var(--line); }
  li:first-child { border-top: 0; }
  .name { font-weight: 600; color: var(--ink); }
  .meta { font-size: 13px; color: var(--muted); }
  .hook { font-size: 14px; margin-top: 4px; font-style: italic; }
  .tag { display: inline-block; font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 99px; background: var(--mist); color: var(--muted); margin-left: 6px; }
  .tag.ok { background: #E8F6EE; color: var(--up); }
  .tag.no { background: #FDECEF; color: var(--rose); }
  label { display: block; font-size: 14px; font-weight: 500; color: var(--ink); margin: 4px 0 6px; }
  textarea { width: 100%; min-height: 72px; padding: 10px; border: 1px solid var(--line); border-radius: 8px; font: inherit; font-size: 15px; resize: vertical; }
  button { display: block; width: 100%; margin-top: 16px; padding: 14px 18px; border: 0; border-radius: 10px; background: var(--ink); color: #fff; font: 600 16px/1 Inter, sans-serif; cursor: pointer; }
  button.skip { background: var(--paper); color: var(--ink); border: 1px solid var(--ink); }
  button:disabled { opacity: .55; cursor: default; }
  a { color: var(--blue); }
  .note { font-size: 13px; color: var(--muted); margin-top: 14px; }
  .msg { padding: 12px 14px; border-radius: 8px; background: var(--mist); font-size: 15px; margin-top: 14px; }
  .msg.ok { background: #E8F6EE; color: #11592C; }
  .msg.err { background: #FDECEF; color: #8A1230; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header><a href="/" aria-label="Wise AI home"><img src="logo.svg" alt="Wise AI"></a></header>
  <div class="card" aria-live="polite">
    <h1 id="title">Lead review</h1>
    <p class="lead" id="sub">Checking the link…</p>
    <ul id="items" hidden></ul>
    <div id="reasonBox" hidden>
      <label for="reason">Why skip? (optional, helps the scout learn)</label>
      <textarea id="reason" maxlength="300" placeholder="e.g. too far away, a franchise, not our kind of client"></textarea>
    </div>
    <button id="go" type="button" hidden></button>
    <div id="out" class="msg" hidden></div>
    <p class="note" id="foot">Approving only adds the business to Leads in the hub. Nothing is sent to anyone.</p>
    <p class="note"><a id="hub" href="https://wise-ai.au/os/#agents/approvals">Open the review list in the hub</a></p>
  </div>
</main>
<script>
(function () {
  "use strict";
  var FN = "https://adfgtlhryyyrqbbgbfmx.supabase.co/functions/v1/agent";
  var KEY = "sb_publishable_4F-GPMDppYgHlQDwB1qvYw_v877M7pV"; // public key (not a secret)
  var token = decodeURIComponent((location.hash || "").replace(/^#/, "")).trim();
  var $ = function (id) { return document.getElementById(id); };
  var VERB = { approve: "Approve", skip: "Skip", approve_all: "Approve all" };
  var ERRORS = {
    bad_link: "This link is not valid. Use the newest email, or decide in the hub.",
    expired: "This link has expired (links last 7 days). You can still decide in the hub.",
    used: "This link was already used.",
    network: "Could not reach Wise AI. Check your connection and try again."
  };

  function call(body) {
    return fetch(FN, {
      method: "POST",
      headers: { "content-type": "application/json", apikey: KEY },
      body: JSON.stringify(body),
      credentials: "omit",
      referrerPolicy: "no-referrer"
    }).then(function (r) { return r.json(); }).catch(function () { return { ok: false, error: "network" }; });
  }
  function text(el, s) { el.textContent = s; }
  function show(el, on) { el.hidden = !on; }
  function msg(kind, s) { var o = $("out"); o.className = "msg " + kind; text(o, s); show(o, true); }
  function statusTag(s) {
    if (s === "approved") return ["Added to Leads", "ok"];
    if (s === "rejected") return ["Skipped", "no"];
    if (s === "expired") return ["Expired", ""];
    return null;
  }
  function render(items) {
    var ul = $("items"); ul.innerHTML = "";
    items.forEach(function (i) {
      var li = document.createElement("li");
      var n = document.createElement("div"); n.className = "name"; text(n, i.business || "A business");
      var t = statusTag(i.status);
      if (t) { var s = document.createElement("span"); s.className = "tag " + t[1]; text(s, t[0]); n.appendChild(s); }
      li.appendChild(n);
      var m = document.createElement("div"); m.className = "meta";
      text(m, [i.suburb, i.industry, i.score != null ? "fit " + i.score + "/100" : ""].filter(Boolean).join(" · "));
      li.appendChild(m);
      if (i.hook) { var h = document.createElement("div"); h.className = "hook"; text(h, i.hook); li.appendChild(h); }
      if (i.open) { var a = document.createElement("a"); a.href = i.open; text(a, "Open the lead"); a.className = "meta"; li.appendChild(a); }
      ul.appendChild(li);
    });
    show(ul, items.length > 0);
  }

  if (!/^[0-9a-f-]{36}\.[A-Za-z0-9_-]{40,50}$/i.test(token)) {
    text($("sub"), ""); msg("err", ERRORS.bad_link); return;
  }
  // Clear the token from the address bar (and so from history and screenshots); it stays in memory.
  try { history.replaceState(null, "", location.pathname); } catch (e) {}

  // 1. Look only: what does this link do? (changes nothing)
  call({ action: "scout_link", d: token }).then(function (p) {
    if (!p.ok) { text($("sub"), ""); msg("err", ERRORS[p.error] || ERRORS.bad_link); return; }
    var waiting = (p.items || []).filter(function (i) { return i.status === "proposed"; });
    render(p.items || []);
    if (p.used) { text($("sub"), ""); msg("", ERRORS.used); return; }
    if (!waiting.length) { text($("sub"), "Already decided. Nothing left to do here."); return; }
    var verb = VERB[p.action] || "Confirm";
    var n = waiting.length;
    text($("title"), p.action === "skip" ? "Skip this business?" : n === 1 ? "Add this business to Leads?" : "Add these " + n + " businesses to Leads?");
    text($("sub"), "Press the button to confirm. The link works once.");
    var go = $("go");
    text(go, p.action === "approve_all" ? verb + " " + n : verb);
    if (p.action === "skip") { go.className = "skip"; show($("reasonBox"), true); text($("foot"), "Skipping removes it from the review list. Nothing is sent to anyone."); }
    show(go, true);

    // 2. The button: the only thing that changes anything.
    go.addEventListener("click", function () {
      go.disabled = true; text(go, "Working…");
      var body = { action: "scout_link", op: "apply", d: token };
      if (p.action === "skip") body.reason = $("reason").value.slice(0, 300);
      call(body).then(function (r) {
        show(go, false); show($("reasonBox"), false);
        if (!r.ok) { msg("err", ERRORS[r.error] || "That did not work. Try again in the hub."); return; }
        var res = r.results || [];
        var added = res.filter(function (x) { return x.ok && x.status === "approved"; }).length;
        var skipped = res.filter(function (x) { return x.ok && x.status === "rejected"; }).length;
        var other = res.length - added - skipped;
        var parts = [];
        if (added) parts.push(added === 1 ? "Added to Leads." : added + " added to Leads.");
        if (skipped) parts.push("Skipped.");
        if (other) parts.push(other + " could not be added (already a lead, opted out, or already decided).");
        msg(added || skipped ? "ok" : "err", parts.join(" ") || "Nothing changed.");
        text($("title"), "Done"); text($("sub"), "");
        render((p.items || []).map(function (i) {
          var d = res.filter(function (x) { return x.candidate_id ? x.candidate_id === i.id : x.business === i.business; })[0];
          return d && d.ok ? Object.assign({}, i, { status: d.status, open: d.open || null }) : i;
        }));
      });
    });
  });
})();
</script>
</body>
</html>
